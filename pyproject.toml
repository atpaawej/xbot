[project]
name = "xbot"
version = "0.1.0"
description = "Autonomous AI Agent with Rich TUI, AI SDK of Python, and TinyFish Web Intelligence"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Aawej Pathan", email = "atpaawej@gmail.com" }
]
dependencies = [
    "ai>=0.8.0",
    "tinyfish>=0.9.0",
    "rich>=14.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "prompt-toolkit>=3.0.0",
    "openai>=1.50.0",
    "inquirerpy>=0.3.4",
    "litellm>=1.105.1",
]

[project.scripts]
xbot = "xbot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xbot"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
